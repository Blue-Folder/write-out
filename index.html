<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WRITE OUT</title>
<meta name="description" content="Soukromý zápisník na ručně psané poznámky.">
<meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F2227" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WRITE OUT">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<style>
:root{
  --desk:#D7DBE1; --desk-dot:rgba(38,50,80,.17);
  --chrome:#F7F8FA; --chrome-2:#ECEFF3;
  --ink:#1A1E27; --muted:#626A79; --line:#C6CCD5;
  --accent:#2B3FC4; --accent-ink:#FFFFFF; --accent-soft:rgba(43,63,196,.12);
  --paper:#FEFEFC; --paper-ink:#1B1F27; --rule:#CCD5E3; --rule-strong:#A9B6CC; --margin:#E9B9B5;
  --sel:#2B3FC4; --sel-soft:rgba(43,63,196,.07);
  --page-shadow:rgba(22,30,52,.20);
  --shadow:0 1px 2px rgba(20,28,48,.08),0 6px 20px rgba(20,28,48,.10);
  --danger:#B3261E; --ok:#2E8F63;
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --display:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;
  --serif:Literata,Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --desk:#15171B; --desk-dot:rgba(205,215,238,.10);
    --chrome:#1F2227; --chrome-2:#2A2E35;
    --ink:#E7E9ED; --muted:#9AA1AD; --line:#363B44;
    --accent:#8C99FF; --accent-ink:#0E1330; --accent-soft:rgba(140,153,255,.16);
    --page-shadow:rgba(0,0,0,.55);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    --danger:#FF8A80; --ok:#5BD19A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --desk:#15171B; --desk-dot:rgba(205,215,238,.10);
  --chrome:#1F2227; --chrome-2:#2A2E35;
  --ink:#E7E9ED; --muted:#9AA1AD; --line:#363B44;
  --accent:#8C99FF; --accent-ink:#0E1330; --accent-soft:rgba(140,153,255,.16);
  --page-shadow:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --danger:#FF8A80; --ok:#5BD19A;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--desk);color:var(--ink);font:14px/1.4 var(--ui);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{position:relative;height:100%;overflow:hidden}
#stage{position:absolute;inset:0;touch-action:none;background:var(--desk);cursor:crosshair;overflow:hidden}
body[data-tool="hand"] #stage{cursor:grab}
body[data-tool="text"] #stage{cursor:text}
#stage canvas{position:absolute;left:0;top:0;width:100%;height:100%}
#live,#paper{pointer-events:none}
#imgs{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
.pimg{position:absolute;overflow:hidden}
.pimg img{position:absolute;display:block;max-width:none;-webkit-user-drag:none;user-select:none}
.ibox{position:absolute;pointer-events:none;display:none;outline:calc(1.5px * var(--inv)) dashed var(--sel);outline-offset:0}
body[data-tool="lasso"] .ibox,body[data-tool="text"] .ibox,body[data-tool="hand"] .ibox,.ibox.fresh{display:block}
.ibar{position:absolute;left:0;bottom:100%;display:flex;gap:2px;padding-bottom:5px;transform-origin:0 100%;transform:scale(var(--inv));pointer-events:auto;white-space:nowrap}
.ibar button,.ibar span{height:30px;min-width:30px;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--chrome);color:var(--ink);border-radius:7px;font:500 12.5px/1 var(--ui);cursor:pointer;padding:0 8px;touch-action:none;box-shadow:var(--shadow)}
.ibar .imove{cursor:grab}
.igrip{position:absolute;right:0;bottom:0;width:30px;height:30px;transform-origin:100% 100%;transform:scale(var(--inv)) translate(40%,40%);pointer-events:auto;touch-action:none;cursor:nwse-resize;border-radius:50%;background:var(--chrome);border:2px solid var(--sel);box-shadow:var(--shadow)}
.card.wide{width:960px}
.viewimg{display:block;max-width:100%;max-height:70vh;margin:0 auto 12px;border-radius:8px;-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}
#world{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;--inv:1}

/* page header + resize grip, counter-scaled to stay the same size on screen */
.hdr{position:absolute;transform-origin:0 0;transform:scale(var(--inv)) translateY(calc(-100% - 8px));display:flex;align-items:center;gap:2px;white-space:nowrap;pointer-events:auto}
.grab{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px 0 6px;border-radius:7px;color:var(--muted);font:500 11px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;cursor:grab;touch-action:none}
.grab svg{opacity:.7}
.grab b{color:var(--ink);font-weight:500}
.grab:hover,.grab.drag{background:var(--chrome);box-shadow:var(--shadow)}
.hbtn{height:32px;display:flex;align-items:center;gap:6px;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:7px;font:500 12.5px/1 var(--ui);padding:0 9px;cursor:pointer}
.hbtn:hover{background:var(--chrome);border-color:var(--line);color:var(--ink)}
.grip{position:absolute;width:30px;height:30px;transform-origin:0 0;transform:scale(var(--inv)) translate(-40%,-40%);pointer-events:auto;touch-action:none;cursor:nwse-resize;display:grid;place-items:center}
.grip::after{content:"";width:11px;height:11px;border-right:2px solid var(--rule-strong);border-bottom:2px solid var(--rule-strong);border-radius:0 0 3px 0}
.grip:hover::after{border-color:var(--accent)}

/* text blocks */
.tb{position:absolute;pointer-events:none}
.tb textarea{display:block;width:100%;margin:0;border:1px dashed transparent;background:transparent;color:var(--paper-ink);font-family:var(--serif);line-height:1.512;padding:4px 6px;resize:none;overflow:hidden;outline:none;border-radius:4px;-webkit-user-select:text;user-select:text;min-height:2em;color-scheme:light}
body[data-tool="text"] .tb{pointer-events:auto}
body[data-tool="text"] .tb textarea{border-color:var(--rule-strong)}
.tb textarea:focus{border-style:solid;border-color:var(--sel);background:rgba(43,63,196,.035)}
.tbar{position:absolute;left:0;bottom:100%;display:none;gap:2px;padding-bottom:4px;transform-origin:0 100%;transform:scale(var(--inv))}
body[data-tool="text"] .tbar{display:flex}
.tbar button,.tbar span{height:28px;min-width:28px;display:grid;place-items:center;border:1px solid var(--line);background:var(--chrome);color:var(--ink);border-radius:6px;font:500 12px/1 var(--mono);cursor:pointer;padding:0 6px;touch-action:none}
.tbar .tmove{cursor:grab}

/* top bar */
.top{position:absolute;left:16px;right:16px;top:12px;display:flex;align-items:flex-start;gap:10px;pointer-events:none;z-index:5}
.top>*{pointer-events:auto}
.brand{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px 8px 8px;background:var(--chrome);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);cursor:pointer;text-align:left;max-width:min(320px,60vw)}
.brand:hover{background:var(--chrome-2)}
.brand .back{flex:none;color:var(--muted);display:grid;place-items:center}
.brand .bcol{display:flex;flex-direction:column;gap:5px;min-width:0}
.status span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.word{font:800 23px/1 var(--display);letter-spacing:.07em;display:flex;gap:.28em;align-items:flex-end}
.word .out{position:relative;color:var(--ink)}
.word .out svg{position:absolute;left:-2px;right:-3px;bottom:-5px;width:calc(100% + 5px);height:8px;overflow:visible}
.status{font:500 10px/1 var(--mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:6px;white-space:nowrap}
.status i{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
.status.busy i{background:var(--muted)}
.dock{flex:1 1 auto;min-width:0;display:flex;justify-content:center}
.dock-in{display:flex;align-items:center;gap:3px;padding:5px;background:var(--chrome);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow-x:auto;max-width:100%;scrollbar-width:none}
.dock-in::-webkit-scrollbar{display:none}
.tbtn{width:44px;height:44px;flex:none;display:grid;place-items:center;border:0;background:transparent;color:var(--ink);border-radius:8px;cursor:pointer}
.tbtn:hover{background:var(--chrome-2)}
.tbtn[aria-pressed="true"]{background:var(--ink);color:var(--chrome)}
.tbtn:disabled{opacity:.35;cursor:default;background:transparent}
.sep{width:1px;height:28px;background:var(--line);margin:0 4px;flex:none}
#opts{display:flex;align-items:center;gap:1px}
#opts:empty{display:none}
#opts:empty + .sep{display:none}
.sw{width:34px;height:44px;flex:none;display:grid;place-items:center;border:0;background:transparent;cursor:pointer;border-radius:8px}
.sw span{width:22px;height:22px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.sw[aria-pressed="true"] span{outline:2px solid var(--ink);outline-offset:3px}
.sz span{background:var(--ink);box-shadow:none}
.sz[aria-pressed="true"]{background:var(--chrome-2)}
.sz[aria-pressed="true"] span{outline:0}
.menu-btn{flex:none;width:46px;height:46px;display:grid;place-items:center;background:var(--chrome);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);cursor:pointer}

/* bottom controls */
.bl{position:absolute;left:16px;bottom:14px;z-index:5;display:flex;gap:8px}
.addpg{height:46px;padding:0 16px 0 12px;display:flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;font:600 14px/1 var(--ui);box-shadow:var(--shadow);cursor:pointer}
.br{position:absolute;right:16px;bottom:14px;z-index:5;display:flex;align-items:center;gap:2px;padding:3px;background:var(--chrome);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.br .tbtn{width:40px;height:40px}
.zl{min-width:62px;height:40px;border:0;background:transparent;border-radius:8px;font:500 12px/1 var(--mono);font-variant-numeric:tabular-nums;cursor:pointer}
.zl:hover{background:var(--chrome-2)}

/* selection bar */
#selbar{position:fixed;z-index:6;display:flex;gap:4px;padding:4px;background:var(--chrome);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);white-space:nowrap}
.sbtn{height:38px;display:flex;align-items:center;gap:7px;padding:0 12px;border:0;border-radius:7px;background:transparent;font:500 13px/1 var(--ui);cursor:pointer;color:var(--ink)}
.sbtn:hover{background:var(--chrome-2)}
.sbtn.primary{background:var(--accent);color:var(--accent-ink)}
.sbtn.danger{color:var(--danger)}

/* page menu popover */
.pop{position:fixed;z-index:30;width:300px;max-width:calc(100% - 32px);padding:14px;background:var(--chrome);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.lab{font:500 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:36px;padding:0 11px;border:1px solid var(--line);background:transparent;border-radius:8px;font:500 13px/1 var(--ui);cursor:pointer;display:flex;align-items:center;gap:7px}
.chip:hover{background:var(--chrome-2)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--chrome)}
.chip .bgp{width:16px;height:16px;border-radius:3px;background:#fff;border:1px solid var(--rule-strong)}
.acts{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:10px}
.act{height:40px;display:flex;align-items:center;gap:10px;padding:0 8px;border:0;background:transparent;border-radius:8px;font:500 14px/1 var(--ui);cursor:pointer;text-align:left}
.act:hover{background:var(--chrome-2)}
.act.danger{color:var(--danger)}
.act.confirm{background:var(--danger);color:#fff}

/* sheet */
#sheet{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(10,14,24,.38)}
.card{width:560px;max-width:100%;max-height:calc(100% - 24px);overflow:auto;background:var(--chrome);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:22px 22px 18px;-webkit-user-select:text;user-select:text}
.card h2{margin:0 0 4px;font:800 28px/1.05 var(--display);letter-spacing:.05em;text-transform:uppercase;text-wrap:balance}
.card h3{margin:0 0 6px;font:600 15px/1.3 var(--ui)}
.card p{margin:0 0 10px;max-width:62ch;color:var(--ink);line-height:1.55}
.card .note{color:var(--muted);font-size:13px}
.card section{padding:14px 0;border-top:1px solid var(--line)}
.card section:first-of-type{border-top:0}
.card ol{margin:0 0 8px;padding-left:20px;line-height:1.6}
.card textarea.big{width:100%;min-height:160px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--paper-ink);font:16px/1.55 var(--serif);resize:vertical;color-scheme:light}
.card textarea.code{font:12px/1.4 var(--mono);min-height:90px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{height:42px;padding:0 16px;border:1px solid var(--line);background:transparent;border-radius:9px;font:500 14px/1 var(--ui);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--chrome-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.confirm{background:var(--danger);border-color:var(--danger);color:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted);font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;padding-top:2px}
.kv dd{margin:0}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:12px;font:500 12px/1 var(--ui);background:var(--chrome-2)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill.yes i{background:var(--ok)}
.pill.no i{background:var(--danger)}
.file-in{position:relative;overflow:hidden}
.file-in input{position:absolute;inset:0;opacity:0;cursor:pointer}

#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:50;max-width:calc(100% - 32px);padding:10px 14px;border-radius:9px;background:var(--ink);color:var(--chrome);font:500 13px/1.3 var(--ui);box-shadow:var(--shadow);pointer-events:none;opacity:0;transition:opacity .18s}
#toast.show{opacity:1}

/* library */
#library{position:absolute;inset:0;z-index:20;background:var(--desk);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:18px 16px 40px}
.lib-top{max-width:1240px;margin:0 auto 22px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 18px}
.lib-brand{display:flex;flex-direction:column;gap:8px;margin-right:auto}
.lib-brand .word{font-size:44px}
.lib-brand .word .out svg{height:12px;bottom:-8px}
.lib-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{height:44px;width:230px;max-width:100%;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--chrome);color:var(--ink);font:14px var(--ui);-webkit-user-select:text;user-select:text}
.search::placeholder{color:var(--muted)}
.lib-body{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;align-items:start}
.folders{display:flex;flex-direction:column;gap:2px;position:sticky;top:0}
.flab{font:500 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 10px 8px}
.frow{display:flex;align-items:center;border-radius:9px}
.frow:hover{background:var(--chrome)}
.frow.on{background:var(--chrome);box-shadow:var(--shadow)}
.fbtn{flex:1;min-width:0;height:42px;display:flex;align-items:center;gap:10px;padding:0 10px;border:0;background:transparent;font:500 14px/1 var(--ui);cursor:pointer;text-align:left}
.fbtn .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbtn .ct{font:500 11.5px/1 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.fdot{width:10px;height:10px;border-radius:3px;background:var(--c,var(--muted));flex:none}
.fmore{width:36px;height:36px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;color:var(--muted);cursor:pointer;flex:none}
.fmore:hover{background:var(--chrome-2);color:var(--ink)}
.fadd{height:42px;display:flex;align-items:center;gap:10px;padding:0 10px;border:1px dashed var(--line);border-radius:9px;background:transparent;color:var(--muted);font:500 14px/1 var(--ui);cursor:pointer;margin-top:8px}
.fadd:hover{color:var(--ink);border-color:var(--muted)}
.lib-head{display:flex;align-items:baseline;gap:12px;margin:4px 0 16px}
.lib-head h1{margin:0;font:800 30px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;text-wrap:balance}
.lib-head span{font:500 12px/1 var(--mono);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px 18px}
.dcard{display:flex;flex-direction:column;gap:10px;min-width:0}
.thumb{display:block;width:100%;aspect-ratio:4/3;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#D7DBE1;padding:0;cursor:pointer;box-shadow:var(--shadow);max-width:100%}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.thumb:hover{border-color:var(--accent)}
.thumb:empty{display:grid;place-items:center}
.thumb:empty::after{content:"";width:30%;aspect-ratio:1/1.414;background:#FEFEFC;box-shadow:0 1px 4px rgba(22,30,52,.2)}
.drow{display:flex;align-items:flex-start;gap:4px}
.dinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.dname{border:0;background:transparent;padding:0;font:600 15px/1.25 var(--ui);text-align:left;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dsub{font:400 11.5px/1.3 var(--mono);color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dsub .fdot{width:8px;height:8px}
.empty{grid-column:1/-1;padding:40px 20px;border:1px dashed var(--line);border-radius:12px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:14px}
.newcard{aspect-ratio:4/3;border:1.5px dashed var(--line);border-radius:10px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);font:500 14px/1 var(--ui);cursor:pointer;width:100%}
.newcard:hover{color:var(--accent);border-color:var(--accent)}
.field{width:100%;height:46px;padding:0 14px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--paper-ink);font:16px var(--ui);color-scheme:light;-webkit-user-select:text;user-select:text}
.card .lab{margin-top:14px}
@media (max-width:760px){
  .lib-body{grid-template-columns:minmax(0,1fr);gap:16px}
  .folders{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:none}
  .folders .flab{display:none}
  .frow{flex:none;border:1px solid var(--line)}
  .fbtn{height:38px}
  .fadd{margin-top:0;flex:none;height:40px}
  .lib-brand .word{font-size:34px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 12px}
}
@media (max-width:760px){
  .brand{padding:8px 10px 8px 6px}
  .word{font-size:19px}
  .addpg span{display:none}

/* ---------- storage: IndexedDB in this browser only ---------- */
let dbP=null;
function openDB(){
  if(dbP) return dbP;
  dbP=new Promise((res,rej)=>{
    try{const r=indexedDB.open('writeout',1);
      r.onupgradeneeded=()=>r.result.createObjectStore('kv');
      r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);}catch(e){rej(e);}
  });
  return dbP;
}
async function idbGet(k){const db=await openDB();return new Promise((res,rej)=>{const q=db.transaction('kv','readonly').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function idbSet(k,v){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
async function idbDel(k){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').delete(k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
/* IndexedDB first, localStorage as fallback */
async function kvGet(k){
  try{const v=await idbGet(k);if(v!==undefined&&v!==null)return v;}catch(e){}
  try{const s=localStorage.getItem('writeout.'+k);return s?JSON.parse(s):null;}catch(e){return null;}
}
async function kvSet(k,v){
  try{await idbSet(k,v);return true;}catch(e){}
  try{localStorage.setItem('writeout.'+k,JSON.stringify(v));return true;}catch(e){return false;}
}
async function kvDel(k){try{await idbDel(k);}catch(e){}try{localStorage.removeItem('writeout.'+k);}catch(e){}}

/* library = folders + document list; each document's canvas lives under doc:<id> */

const folderById=id=>lib.folders.find(f=>f.id===id);

function saveSoon(kind){if(!doc)return;if(kind!=='cam'){contentDirty=true;setStatus('Ukládám…',true);}clearTimeout(saveT);saveT=setTimeout(saveNow,450);}
async function saveNow(){
  clearTimeout(saveT);

/* small preview image of a document for the library */
function makeThumb(){
  const TW=360,TH=270,c=document.createElement('canvas');c.width=TW;c.height=TH;
  const g=c.getContext('2d');g.fillStyle='#D7DBE1';g.fillRect(0,0,TW,TH);
  if(!doc.pages.length) return c.toDataURL('image/jpeg',.8);
  const first=doc.pages[0];
  let x0=first.x,y0=first.y,x1=first.x+first.w,y1=first.y+first.h;
  for(const p of doc.pages.slice(1,4)){x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x+p.w);y1=Math.max(y1,p.y+p.h);}
  const pad=24,s=Math.min((TW-pad*2)/(x1-x0),(TH-pad*2)/(y1-y0));
  const ox=(TW-(x1-x0)*s)/2-x0*s,oy=pad-y0*s;
  const byPage=new Map();for(const st of doc.strokes){let a=byPage.get(st.pageId);if(!a)byPage.set(st.pageId,a=[]);a.push(st);}
  for(const p of doc.pages){
    g.setTransform(s,0,0,s,ox+p.x*s,oy+p.y*s);
    g.save();g.shadowColor='rgba(22,30,52,.18)';g.shadowBlur=6;g.shadowOffsetY=1;g.fillStyle='#FEFEFC';g.fillRect(0,0,p.w,p.h);g.restore();
    g.save();g.beginPath();g.rect(0,0,p.w,p.h);g.clip();
    if(p.bg==='lines'){g.strokeStyle='#DCE2EC';g.lineWidth=1.5/s*.6;g.beginPath();for(let y=8*MM*2;y<p.h;y+=8*MM){g.moveTo(0,y);g.lineTo(p.w,y);}g.stroke();}
    for(const im of (doc.images||[]).filter(i=>i.pageId===p.id)){const el=imgEls.get(im.id);if(el&&el.complete&&el.naturalWidth){try{g.drawImage(el,im.x,im.y,im.w,im.h);}catch(_){}}}
    for(const st of byPage.get(p.id)||[]) drawStroke(g,st,null);
    for(const t of doc.texts.filter(t=>t.pageId===p.id)){
      g.fillStyle='#1B1F27';g.font=`${t.fs}px Literata, Georgia, serif`;
      const lh=t.fs*1.5;let y=t.y+4+t.fs;
      for(const line of (t.text||'').split('\n')){
        const words=line.split(' ');let cur='';
        for(const w of words){const test=cur?cur+' '+w:w;if(g.measureText(test).width>t.w-12&&cur){g.fillText(cur,t.x+6,y);y+=lh;cur=w;}else cur=test;}
        g.fillText(cur,t.x+6,y);y+=lh;if(y>p.h)break;
      }
    }
    g.restore();
  }
  return c.toDataURL('image/jpeg',.8);
}

const bbCache=new WeakMap();
function bboxOf(st){
  let b=bbCache.get(st); if(b) return b;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const q of st.pts){if(q[0]<x0)x0=q[0];if(q[1]<y0)y0=q[1];if(q[0]>x1)x1=q[0];if(q[1]>y1)y1=q[1];}
  const r=st.s/2; b={x:x0-r,y:y0-r,w:x1-x0+2*r,h:y1-y0+2*r}; bbCache.set(st,b); return b;
}
function fmtLabel(p){

/* ---------- stroke geometry ---------- */
function smooth(pts){
  if(pts.length<3) return pts;
  const o=[pts[0]];
  for(let i=1;i<pts.length-1;i++){const a=pts[i-1],b=pts[i],c=pts[i+1];o.push([(a[0]+2*b[0]+c[0])/4,(a[1]+2*b[1]+c[1])/4,(a[2]+2*b[2]+c[2])/4]);}
  o.push(pts[pts.length-1]); return o;
}
function buildPath(st){
  const pts=st.k==='marker'?st.pts:smooth(st.pts), n=pts.length;
  const body=new Path2D(), caps=new Path2D();
  if(!n) return {body,caps};
  if(st.k==='marker'){
    body.moveTo(pts[0][0],pts[0][1]);
    if(n===1) body.lineTo(pts[0][0]+.01,pts[0][1]);
    for(let i=1;i<n;i++) body.lineTo(pts[i][0],pts[i][1]);
    return {body,caps};
  }
  const wOf=q=>st.s*(0.42+0.85*q[2])/2;
  if(n===1){caps.arc(pts[0][0],pts[0][1],wOf(pts[0]),0,Math.PI*2);return {body,caps};}
  const L=[],R=[];
  for(let i=0;i<n;i++){

/* ---------- rendering ---------- */

function render(){

  pctx.setTransform(1,0,0,1,0,0);pctx.clearRect(0,0,paper.width,paper.height);
  const z=cam.z, g=48;
  if(z*g>=14){
    pctx.fillStyle=C.deskDot;
    const x0=Math.floor(-cam.x/z/g)*g, y0=Math.floor(-cam.y/z/g)*g, x1=(W-cam.x)/z, y1=(H-cam.y)/z, r=1.6*dpr;
    for(let x=x0;x<=x1;x+=g) for(let y=y0;y<=y1;y+=g) pctx.fillRect((x*z+cam.x)*dpr-r/2,(y*z+cam.y)*dpr-r/2,r,r);
  }
  const map=new Map();

  const vx0=-cam.x/z,vy0=-cam.y/z,vx1=(W-cam.x)/z,vy1=(H-cam.y)/z;
  for(const p of doc.pages){
    if(p.x>vx1||p.y>vy1||p.x+p.w<vx0||p.y+p.h<vy0) continue;

  }

      const sx=(b.x+selOff.x)*z+cam.x-6, sy=(b.y+selOff.y)*z+cam.y-6, sw=b.w*z+12, sh=b.h*z+12;
      ctx.fillStyle=C.selSoft;ctx.fillRect(sx,sy,sw,sh);

}
function drawPage(p,list){
  const z=cam.z,s=dpr*z;

  pctx.save();pctx.shadowColor=C.shadow;pctx.shadowBlur=16*dpr;pctx.shadowOffsetY=3*dpr;pctx.fillStyle=C.paper;pctx.fillRect(0,0,p.w,p.h);pctx.restore();

  ctx.setTransform(s,0,0,s,dpr*(cam.x+p.x*z),dpr*(cam.y+p.y*z));
  ctx.save();ctx.beginPath();ctx.rect(0,0,p.w,p.h);ctx.clip();

    ctx.strokeStyle=C.rule;ctx.lineWidth=lw;ctx.stroke();

function fitBox(b){

function fitAll(){

/* ---------- undo ---------- */

/* drag page label / resize grip / move text */
world.addEventListener('pointerdown',e=>{
  const grab=e.target.closest('.grab'),grip=e.target.closest('.grip'),th=e.target.closest('.tmove'),ih=e.target.closest('.imove'),ig=e.target.closest('.igrip');
  if(!grab&&!grip&&!th&&!ih&&!ig) return;
  e.preventDefault();e.stopPropagation();closePop();
  const el=grab||grip||th||ih||ig;try{el.setPointerCapture(e.pointerId);}catch(_){}
  const snap=snapshot();let moved=false;const sx=e.clientX,sy=e.clientY;
  let obj,ox,oy,kind;
  if(grab){obj=pageById(grab.closest('.hdr').dataset.id);ox=obj.x;oy=obj.y;kind='move';grab.classList.add('drag');}
  else if(grip){obj=pageById(grip.dataset.id);ox=obj.w;oy=obj.h;kind='size';}
  else if(ih){obj=imageById(ih.closest('.ibox').dataset.id);ox=obj.x;oy=obj.y;kind='img';}
  else if(ig){obj=imageById(ig.closest('.ibox').dataset.id);ox=obj.w;oy=obj.h;kind='imgsize';}
  else{obj=textById(th.closest('.tb').dataset.id);ox=obj.x;oy=obj.y;kind='text';}
  const mv=ev=>{
    const dx=(ev.clientX-sx)/cam.z,dy=(ev.clientY-sy)/cam.z;
    if(Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)>2) moved=true;
    if(kind==='move'){obj.x=Math.round((ox+dx)/10)*10;obj.y=Math.round((oy+dy)/10)*10;}
    else if(kind==='size'){obj.w=Math.max(240,Math.round(ox+dx));obj.h=Math.max(240,Math.round(oy+dy));}
    else if(kind==='imgsize'){const r=oy/ox,nw=Math.max(40,ox+Math.max(dx,dy/r));obj.w=Math.round(nw);obj.h=Math.round(nw*r);}
    else{obj.x=ox+dx;obj.y=oy+dy;}
    updatePositions();requestRender();
  };
  const up=()=>{
    el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);
    if(grab) grab.classList.remove('drag');
    if(moved){
      if(kind==='img') reparentImage(obj);
      undoStack.push(snap);redoStack=[];updUndo();if(kind==='size'||kind==='img')renderOverlay();saveSoon();
    }
  };
  el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
});

function reparentImage(im){

function loadImageFile(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),i=new Image();
    i.onload=()=>{res(i);setTimeout(()=>URL.revokeObjectURL(url),1000);};
    i.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('load'));};
    i.src=url;
  });
}
async function fileToImage(file){
  const img=await loadImageFile(file);
  let w=img.naturalWidth,h=img.naturalHeight;if(!w||!h) throw new Error('empty');
  const s=Math.min(1,2000/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  const alpha=/png|gif|webp/.test(file.type);
  if(!alpha){g.fillStyle='#fff';g.fillRect(0,0,w,h);}
  g.drawImage(img,0,0,w,h);
  let src=alpha?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.86);
  if(alpha&&src.length>2500000){g.globalCompositeOperation='destination-over';g.fillStyle='#fff';g.fillRect(0,0,w,h);src=c.toDataURL('image/jpeg',.86);}
  return {src,w,h};
}
function targetPage(){
  const c=toWorld(W/2,H/2);let p=pageAt(c.x,c.y);if(p) return p;
  let best=null,bd=Infinity;
  for(const q of doc.pages){const dx=Math.max(q.x-c.x,0,c.x-(q.x+q.w)),dy=Math.max(q.y-c.y,0,c.y-(q.y+q.h)),d=dx*dx+dy*dy;if(d<bd){bd=d;best=q;}}
  return best;

async function insertImages(files){

  if(!files.length||!doc) return;
  let page=targetPage();
  if(!page){addPage();page=doc.pages[doc.pages.length-1];}
  toast(files.length>1?`Vkládám ${files.length} obrázky…`:'Vkládám obrázek…');
  const snap=snapshot();let added=0,off=0;
  const c=toWorld(W/2,H/2);
  for(const f of files){
    let r;try{r=await fileToImage(f);}catch(e){toast('Tenhle soubor se nepodařilo načíst jako obrázek');continue;}
    const s=Math.min(1,(page.w-80)/r.w,(page.h*.7)/r.h),w=Math.round(r.w*s),h=Math.round(r.h*s);
    const x=clamp(c.x-page.x-w/2+off,24,Math.max(24,page.w-w-24)),y=clamp(c.y-page.y-h/2+off,24,Math.max(24,page.h-h-24));
    const im={id:uid(),pageId:page.id,x:Math.round(x),y:Math.round(y),w,h,src:r.src};
    doc.images.push(im);freshIds.add(im.id);added++;off+=32;
  }
  if(!added) return;
  undoStack.push(snap);if(undoStack.length>100)undoStack.shift();redoStack=[];updUndo();
  renderOverlay();requestRender();saveSoon();
  toast(added>1?'Obrázky jsou na listu. Přesunout a zvětšit je můžeš i později v režimu Laso.':'Obrázek je na listu. Přesunout a zvětšit ho můžeš i později v režimu Laso.');
}

/* ---------- pointer input on the canvas ---------- */
stage.addEventListener('pointerdown',onDown);
stage.addEventListener('pointermove',onMove);
stage.addEventListener('pointerup',onUp);
stage.addEventListener('pointercancel',onUp);
stage.addEventListener('pointerleave',e=>{if(!ptrs.has(e.pointerId)&&prefs.tool==='eraser')eraserHover(null);});

function onDown(e){
  if(e.target.closest&&e.target.closest('.hdr,.grip,.tb,.ibox')) return;
  if(freshIds.size){freshIds=new Set();world.querySelectorAll('.ibox.fresh').forEach(x=>x.classList.remove('fresh'));}
  closePop();
  const ae=document.activeElement; if(ae&&ae.tagName==='TEXTAREA') ae.blur();
  const p=local(e),type=e.pointerType;
  if(type==='pen'){
    lastPen=Date.now();
    if(!prefs.penSeen){prefs.penSeen=true;savePrefs();}
    if(action&&action.touch){ if(action.type==='draw'||action.type==='lasso'){action=null;scheduleLive();} else action=null; for(const [id,v] of ptrs) if(v.type==='touch') ptrs.delete(id); }
  }
  if(type==='touch'){
    if(action&&action.pen) return;
    if(prefs.penSeen&&fingerPans()&&Date.now()-lastPen<350) return;
  }
  ptrs.set(e.pointerId,{x:p.x,y:p.y,type});
  try{stage.setPointerCapture(e.pointerId);}catch(_){}
  if(type==='touch'){
    const touches=[...ptrs.entries()].filter(([,v])=>v.type==='touch');
    if(touches.length>=2){
      if(action&&(action.type==='draw'||action.type==='lasso'||action.type==='erase')){
        if(action.type==='erase'&&action.changed){undoStack.push(action.snap);redoStack=[];updUndo();saveSoon();}
        action=null;scheduleLive();
      }
      startPinch(touches);return;
    }
    if(prefs.tool==='hand'||fingerPans()){startPan(e.pointerId,p,true);return;}
  }
  if(type==='mouse'){
    if(e.button===1||spaceDown){startPan(e.pointerId,p,false);return;}
    if(e.button!==0){ptrs.delete(e.pointerId);return;}
  }
  if(prefs.tool==='hand'){startPan(e.pointerId,p,type==='touch');return;}
  startTool(e,p);
}
function startPan(id,p,touch){action={type:'pan',id,touch,sx:p.x,sy:p.y,cx:cam.x,cy:cam.y};}
function startPinch(t){
  const a=t[0][1],b=t[1][1],c0={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
  action={type:'pinch',touch:true,ids:[t[0][0],t[1][0]],d0:Math.hypot(a.x-b.x,a.y-b.y)||1,z0:cam.z,w0:toWorld(c0.x,c0.y)};
}
function doPinch(){
  const a=ptrs.get(action.ids[0]),b=ptrs.get(action.ids[1]);if(!a||!b)return;
  const d=Math.hypot(a.x-b.x,a.y-b.y),c={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
  const z=clamp(action.z0*d/action.d0,.08,5);
  cam.z=z;cam.x=c.x-action.w0.x*z;cam.y=c.y-action.w0.y*z;applyCam();
}
function startTool(e,p){
  const w=toWorld(p.x,p.y);
  const t=(e.pointerType==='pen'&&(e.buttons&32))?'eraser':prefs.tool;
  const base={id:e.pointerId,pen:e.pointerType==='pen',touch:e.pointerType==='touch'};
  if(t==='pen'||t==='marker'){
    const page=pageAt(w.x,w.y);
    if(!page){startPan(e.pointerId,p,base.touch);return;}
    const ts=prefs.ts[t];
    const st={id:uid(),pageId:page.id,k:t,c:(t==='pen'?PEN_COLORS:MARK_COLORS)[ts.c],s:(t==='pen'?PEN_SIZES:MARK_SIZES)[ts.s],st:Date.now(),pts:[]};
    action={...base,type:'draw',st,page,t0:performance.now()};
    addPt(e,w);scheduleLive();
  }else if(t==='eraser'){
    action={...base,type:'erase',snap:snapshot(),changed:false,cur:p};
    eraseAt(w);scheduleLive();
  }else if(t==='lasso'){
    if(sel.size){
      const b=selBBox(),m=8/cam.z;
      if(b&&w.x>=b.x-m&&w.x<=b.x+b.w+m&&w.y>=b.y-m&&w.y<=b.y+b.h+m){action={...base,type:'movesel',start:w};return;}
      clearSel();
    }
    action={...base,type:'lasso',pts:[[w.x,w.y]]};
  }else if(t==='text'){
    const page=pageAt(w.x,w.y);
    if(!page){startPan(e.pointerId,p,base.touch);return;}
    action={...base,type:'textTap',page,w,sx:p.x,sy:p.y};
  }
}
function addPt(e,w){
  const a=action,page=a.page,pts=a.st.pts;
  const x=Math.round((w.x-page.x)*10)/10,y=Math.round((w.y-page.y)*10)/10;
  const last=pts[pts.length-1];
  if(last&&Math.hypot(x-last[0],y-last[1])<0.7/cam.z) return;
  const pr=e.pointerType==='pen'?(e.pressure||.5):.5;
  pts.push([x,y,Math.round(pr*100)/100,Math.round(performance.now()-a.t0)]);
}
function onMove(e){
  if(!ptrs.has(e.pointerId)){
    if(prefs.tool==='eraser'&&e.pointerType!=='touch'&&!action) eraserHover(local(e));
    return;
  }
  const p=local(e),r=ptrs.get(e.pointerId);r.x=p.x;r.y=p.y;
  if(!action) return;
  if(action.type==='pinch'){doPinch();return;}
  if(action.id!==e.pointerId) return;
  switch(action.type){
    case 'pan':cam.x=action.cx+(p.x-action.sx);cam.y=action.cy+(p.y-action.sy);applyCam();break;
    case 'draw':{
      const evs=(e.getCoalescedEvents&&e.getCoalescedEvents())||[];
      for(const ce of (evs.length?evs:[e])){const q=local(ce);addPt(ce,toWorld(q.x,q.y));}
      scheduleLive();break;}
    case 'erase':action.cur=p;eraseAt(toWorld(p.x,p.y));scheduleLive();break;
    case 'lasso':{const w=toWorld(p.x,p.y);action.pts.push([w.x,w.y]);scheduleLive();break;}
    case 'movesel':{const w=toWorld(p.x,p.y);selOff={x:w.x-action.start.x,y:w.y-action.start.y};requestRender();break;}
    case 'textTap':if(Math.hypot(p.x-action.sx,p.y-action.sy)>10) action.moved=true;break;
  }
}
function onUp(e){
  if(!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if(!action) return;
  if(action.type==='pinch'){
    if(action.ids.includes(e.pointerId)){action=null;saveSoon("cam");}
    return;
  }
  if(action.id!==e.pointerId) return;
  const a=action;action=null;
  switch(a.type){
    case 'draw':
      if(a.st.pts.length){pushUndo();doc.strokes.push(a.st);saveSoon();}
      requestRender();scheduleLive();break;
    case 'erase':
      if(a.changed){undoStack.push(a.snap);redoStack=[];updUndo();saveSoon();}
      scheduleLive();break;
    case 'lasso':finishLasso(a.pts);scheduleLive();break;
    case 'movesel':commitMove();break;
    case 'textTap':if(!a.moved&&e.type!=='pointercancel') createText(a.page,a.w.x-a.page.x,a.w.y-a.page.y);break;
    case 'pan':saveSoon("cam");break;
  }
}
function segDist(px,py,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;
  let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=clamp(t,0,1);
  return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));
}
function eraseAt(w){
  const r=ERASER_SIZES[prefs.ts.eraser.s]/2/cam.z;
  const hit=new Set();
  for(const s of doc.strokes){
    const p=pageById(s.pageId);if(!p)continue;
    const lx=w.x-p.x,ly=w.y-p.y,b=bboxOf(s);
    if(lx<b.x-r||lx>b.x+b.w+r||ly<b.y-r||ly>b.y+b.h+r) continue;
    const pts=s.pts,rr=r+s.s/2;
    if(pts.length===1){if(Math.hypot(lx-pts[0][0],ly-pts[0][1])<rr)hit.add(s.id);continue;}
    for(let i=1;i<pts.length;i++){if(segDist(lx,ly,pts[i-1][0],pts[i-1][1],pts[i][0],pts[i][1])<rr){hit.add(s.id);break;}}
  }
  if(hit.size){doc.strokes=doc.strokes.filter(s=>!hit.has(s.id));action.changed=true;requestRender();}
}

/* ---------- lasso selection ---------- */
function inPoly(x,y,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];
    if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function finishLasso(poly){
  if(poly.length<4){clearSel();return;}
  sel=new Set();
  for(const s of doc.strokes){
    const p=pageById(s.pageId);if(!p)continue;
    const step=Math.max(1,Math.floor(s.pts.length/24));let n=0,inn=0;
    for(let i=0;i<s.pts.length;i+=step){n++;if(inPoly(s.pts[i][0]+p.x,s.pts[i][1]+p.y,poly))inn++;}
    if(n&&inn/n>=.5) sel.add(s.id);
  }
  if(!sel.size) toast('Laso nezachytilo žádný rukopis');
  updateSelbar();requestRender();
}
function selStrokes(){return doc.strokes.filter(s=>sel.has(s.id));}
function selBBox(){
  const list=selStrokes();if(!list.length) return null;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const s of list){const p=pageById(s.pageId),b=bboxOf(s);x0=Math.min(x0,b.x+p.x);y0=Math.min(y0,b.y+p.y);x1=Math.max(x1,b.x+b.w+p.x);y1=Math.max(y1,b.y+b.h+p.y);}
  return {x:x0,y:y0,w:x1-x0,h:y1-y0};
}
function clearSel(){sel=new Set();selOff={x:0,y:0};updateSelbar();requestRender();}
function commitMove(){
  const dx=selOff.x,dy=selOff.y;selOff={x:0,y:0};
  if(Math.abs(dx)+Math.abs(dy)<.5){requestRender();return;}
  pushUndo();
  doc.strokes=doc.strokes.map(s=>sel.has(s.id)?{...s,pts:s.pts.map(q=>[Math.round((q[0]+dx)*10)/10,Math.round((q[1]+dy)*10)/10,q[2],q[3]])}:s);
  saveSoon();requestRender();
}
const selbar=$('#selbar');
function updateSelbar(){
  selbar.hidden=!sel.size;
  if(sel.size){$('#selConvert').innerHTML=`${svg('convert',18)}Převést na text`;$('#selDelete').innerHTML=`${svg('trash',18)}Smazat`;positionSelbar();}
}
function positionSelbar(){
  if(selbar.hidden) return;
  const b=selBBox();if(!b){selbar.hidden=true;return;}
  const bw=selbar.offsetWidth,bh=selbar.offsetHeight;
  let x=(b.x+selOff.x+b.w/2)*cam.z+cam.x+rect.left-bw/2;
  let y=(b.y+selOff.y)*cam.z+cam.y+rect.top-bh-16;
  if(y<rect.top+70) y=(b.y+selOff.y+b.h)*cam.z+cam.y+rect.top+16;
  x=clamp(x,16,innerWidth-bw-16);y=clamp(y,16,innerHeight-bh-16);
  selbar.style.left=x+'px';selbar.style.top=y+'px';
}
$('#selClear').onclick=clearSel;
$('#selDelete').onclick=()=>{pushUndo();doc.strokes=doc.strokes.filter(s=>!sel.has(s.id));clearSel();saveSoon();};
$('#selConvert').onclick=()=>convertStrokes(selStrokes());

/* ---------- handwriting recognition, on this device only ---------- */
const hwLangP=(async()=>{
  if(!('createHandwritingRecognizer' in navigator)) return null;
  for(const lang of ['cs','en']){
    try{
      if(navigator.queryHandwritingRecognizer){const r=await navigator.queryHandwritingRecognizer({languages:[lang]});if(r) return lang;}
      else if(navigator.queryHandwritingRecognizerSupport){const r=await navigator.queryHandwritingRecognizerSupport({languages:[lang]});if(r&&r.languages!==false) return lang;}
      else return lang;
    }catch(e){}
  }
  return null;
})();
function groupLines(list){
  const items=list.map(s=>{const p=pageById(s.pageId),b=bboxOf(s);return {s,top:b.y+p.y,bot:b.y+b.h+p.y,cy:b.y+b.h/2+p.y};}).sort((a,b)=>a.cy-b.cy);
  const lines=[];
  for(const it of items){
    let L=null;
    for(const l of lines){
      const ov=Math.min(l.bot,it.bot)-Math.max(l.top,it.top),h=Math.max(1,Math.min(l.bot-l.top,it.bot-it.top));
      if(ov>.4*h||(it.cy>l.top&&it.cy<l.bot)){L=l;break;}
    }
    if(L){L.items.push(it);L.top=Math.min(L.top,it.top);L.bot=Math.max(L.bot,it.bot);}
    else lines.push({top:it.top,bot:it.bot,items:[it]});
  }
  lines.sort((a,b)=>a.top-b.top);
  return lines.map(l=>l.items.map(i=>i.s).sort((a,b)=>(a.st||0)-(b.st||0)));
}
async function recognize(list,lang){
  const rec=await navigator.createHandwritingRecognizer({languages:[lang]});
  const out=[];
  try{
    for(const line of groupLines(list)){
      const d=rec.startDrawing({recognitionType:'text',inputType:'stylus',alternatives:1});
      const t0=Math.min(...line.map(s=>s.st||0));let T=0;
      for(const s of line){
        const p=pageById(s.pageId),hs=new HandwritingStroke();
        for(const q of s.pts){let t=(s.st-t0)+(q[3]||0);if(t<=T)t=T+1;T=t;hs.addPoint({x:q[0]+p.x,y:q[1]+p.y,t});}
        d.addStroke(hs);
      }
      const pr=await d.getPrediction();
      out.push(pr&&pr[0]?pr[0].text:'');
      if(d.clear) d.clear();
    }
  }finally{if(rec.finish) rec.finish();}
  return out.filter(x=>x.trim()).join('\n');
}
async function convertStrokes(list){
  list=list.filter(s=>s.k==='pen');
  if(!list.length){toast('Tady není žádný rukopis perem k převodu');return;}
  const lang=await hwLangP;
  if(!lang){openUnsupported();return;}
  toast('Převádím přímo v zařízení…');
  let text='';
  try{text=await recognize(list,lang);}
  catch(err){openSheet(`<h2>Převod se nepovedl</h2><p>Prohlížeč rozpoznávání rukopisu nabízí, ale teď ho nešlo spustit (${esc(String(err&&err.message||err))}). Zkus to znovu, případně stránku načti znovu.</p><div class="row"><button class="btn primary" data-close>Zavřít</button></div>`);return;}
  openConvertSheet(text,list,lang);
}
function openConvertSheet(text,list,lang){
  openSheet(`<h2>Převedený text</h2>
    <p class="note">Rozpoznáno přímo v tomto zařízení${lang==='cs'?', čeština':'. Čeština tu není k dispozici, použila se angličtina'}. Text můžeš před vložením opravit.</p>
    <textarea class="big" id="convText" spellcheck="false" aria-label="Převedený text"></textarea>
    <div class="row">
      <button class="btn primary" id="cvReplace">Nahradit rukopis textem</button>
      <button class="btn" id="cvKeep">Vložit a rukopis nechat</button>
      <button class="btn" id="cvCopy">${svg('copy',17)}Kopírovat</button>
      <button class="btn" data-close>Zavřít</button>
    </div>`);
  const ta=$('#convText');ta.value=text||'';
  if(!text) ta.placeholder='Nic se nerozpoznalo. Můžeš text dopsat sem.';
  $('#cvReplace').onclick=()=>{insertConverted(ta.value,list,true);closeSheet();};
  $('#cvKeep').onclick=()=>{insertConverted(ta.value,list,false);closeSheet();};
  $('#cvCopy').onclick=()=>copyText(ta.value,ta);
}
function insertConverted(text,list,replace){
  if(!text.trim()){toast('Text je prázdný, nic se nevložilo');return;}
  const page=pageById(list[0].pageId);
  const own=list.filter(s=>s.pageId===page.id);
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const s of own){const b=bboxOf(s);x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.w);y1=Math.max(y1,b.y+b.h);}
  const lines=Math.max(1,groupLines(own).length);
  const fs=Math.round(clamp((y1-y0)/lines*.5,16,40));
  pushUndo();
  const w=Math.min(page.w-x0-8,Math.max(x1-x0+20,280));
  doc.texts.push({id:uid(),pageId:page.id,x:Math.max(4,x0-6),y:Math.max(4,y0-6),w:Math.max(160,w),fs,text:text.trim()});
  if(replace){const ids=new Set(list.map(s=>s.id));doc.strokes=doc.strokes.filter(s=>!ids.has(s.id));}
  clearSel();renderOverlay();requestRender();saveSoon();

}

function addPage(){

function duplicatePage(p){
  pushUndo();

  doc.pages.push(np);
  doc.strokes=doc.strokes.concat(doc.strokes.filter(s=>s.pageId===p.id).map(s=>({...s,id:uid(),pageId:np.id})));
  doc.texts=doc.texts.concat(doc.texts.filter(t=>t.pageId===p.id).map(t=>({...t,id:uid(),pageId:np.id})));
  doc.images=doc.images.concat(doc.images.filter(i=>i.pageId===p.id).map(i=>({...i,id:uid(),pageId:np.id})));

function deletePage(p){

  doc.texts=doc.texts.filter(t=>t.pageId!==p.id);

async function offlineState(){

    return 'wait';
  }catch(e){return 'wait';}
}

function folderSheet(f){
  let color=f?f.color:FOLDER_COLORS[lib.folders.length%FOLDER_COLORS.length];
  openSheet(`<h2>${f?'Přejmenovat složku':'Nová složka'}</h2><div class="lab">Název</div><input class="field" id="nameIn" maxlength="60" autocomplete="off" spellcheck="false" placeholder="Třeba Deník, Práce, Japonsko">
    <div class="lab">Barva</div><div class="seg" id="colPick">${FOLDER_COLORS.map(c=>`<button class="sw" data-c="${c}" style="--c:${c};width:40px" aria-label="Barva" aria-pressed="${color===c}"><span></span></button>`).join('')}</div>
    <div class="row"><button class="btn primary" id="nameOk">${f?'Uložit':'Vytvořit složku'}</button><button class="btn" data-close>Zrušit</button></div>`);
  const i=$('#nameIn');i.value=f?f.name:'';i.focus();
  bindPick($('#colPick'),null,b=>color=b.dataset.c);
  const ok=async()=>{
    const v=i.value.trim();if(!v){toast('Napiš název složky');return;}
    if(f){f.name=v;f.color=color;}else{const nf={id:uid(),name:v,color};lib.folders.push(nf);libFolder=nf.id;}
    await kvSet('lib',lib);closeSheet();renderLibrary();
  };
  $('#nameOk').onclick=ok;i.onkeydown=e=>{if(e.key==='Enter')ok();};
}
function moveSheet(e){
  openSheet(`<h2>Přesunout dokument</h2><p class="note">„${esc(e.name)}“ přesunout do:</p>${folderChips(e.folderId&&folderById(e.folderId)?e.folderId:'')}
    <div class="row"><button class="btn" data-close>Zavřít</button></div>`);
  bindPick($('#folderPick'),null,async b=>{e.folderId=b.dataset.f||null;await kvSet('lib',lib);closeSheet();renderLibrary();const f=folderById(e.folderId);toast(f?`Přesunuto do složky ${f.name}`:'Přesunuto do části Bez složky');});
}
function newDocSheet(){
  let folder=folderById(libFolder)?libFolder:'', fk='a4p', bg='lines';
  openSheet(`<h2>Nový dokument</h2><div class="lab">Název</div><input class="field" id="nameIn" maxlength="80" autocomplete="off" spellcheck="false" placeholder="Bez názvu">
    <div class="lab">Složka</div>${folderChips(folder)}
    <div class="lab">První list</div><div class="seg" id="fmtPick">${FORMATS.map(f=>`<button class="chip" data-k="${f.k}" aria-pressed="${f.k===fk}">${f.label}</button>`).join('')}</div>
    <div class="seg" id="bgPick" style="margin-top:8px">${Object.entries(BGS).map(([k,v])=>`<button class="chip" data-k="${k}" aria-pressed="${k===bg}">${v}</button>`).join('')}</div>
    <div class="row"><button class="btn primary" id="nameOk">Vytvořit a otevřít</button><button class="btn" data-close>Zrušit</button></div>`);
  const i=$('#nameIn');i.focus();
  bindPick($('#folderPick'),null,b=>folder=b.dataset.f);
  bindPick($('#fmtPick'),null,b=>fk=b.dataset.k);
  bindPick($('#bgPick'),null,b=>bg=b.dataset.k);
  const ok=async()=>{
    const id=uid(),now=Date.now(),data=blankDoc(fk,bg);
    lib.docs.push({id,name:i.value.trim()||'Bez názvu',folderId:folder||null,created:now,updated:now,pages:1});
    await kvSet('doc:'+id,data);await kvSet('lib',lib);closeSheet();openDoc(id);
  };
  $('#nameOk').onclick=ok;i.onkeydown=e=>{if(e.key==='Enter')ok();};
}
async function duplicateDoc(e){
  const d=await kvGet('doc:'+e.id);if(!d){toast('Dokument se nepodařilo načíst');return;}
  const id=uid(),now=Date.now();
  lib.docs.push({...e,id,name:e.name+' (kopie)',created:now,updated:now});
  await kvSet('doc:'+id,JSON.parse(JSON.stringify(d)));await kvSet('lib',lib);renderLibrary();toast('Dokument je zduplikovaný');
}
async function openDoc(id){
  const e=entryById(id);if(!e){showLibrary();return;}
  if(doc&&currentId&&currentId!==id) await saveNow();
  let d=await kvGet('doc:'+id);
  if(!d||!Array.isArray(d.pages)) d=blankDoc('a4p','lines');
  d.texts=d.texts||[];d.strokes=d.strokes||[];d.images=d.images||[];
  sel=new Set();selOff={x:0,y:0};selbar.hidden=true;undoStack=[];redoStack=[];action=null;ptrs.clear();closePop();
  doc=d;currentId=id;
  libEl.hidden=true;prefs.view='doc';prefs.lastDoc=id;savePrefs();
  resize();updUndo();renderOverlay();
  if(d.cam&&isFinite(d.cam.z)){cam=d.cam;applyCam();}
  else{cam={x:0,y:0,z:1};const p=doc.pages[0];if(p)fitBox({x:p.x-40,y:p.y,w:Math.min(p.w*2.2,2400),h:p.h});else applyCam();}
  setStatus(docPath());
}

/* ---------- toolbar ---------- */
function setTool(t){
  prefs.tool=t;savePrefs();document.body.dataset.tool=t;
  document.querySelectorAll('[data-tool]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tool===t));
  if(t!=='lasso'&&sel.size) clearSel();
  if(t!=='eraser') eraserHover(null);
  renderOpts();
}
function renderOpts(){
  const o=$('#opts'),t=prefs.tool;let h='';
  if(t==='pen'||t==='marker'){
    const cols=t==='pen'?PEN_COLORS:MARK_COLORS,names=t==='pen'?['Grafit','Kobalt','Červená','Zelená']:['Žlutá','Zelená','Růžová','Modrá'];
    h+=cols.map((c,i)=>`<button class="sw" data-c="${i}" style="--c:${c}" aria-label="${names[i]}" title="${names[i]}" aria-pressed="${prefs.ts[t].c===i}"><span></span></button>`).join('');
    h+='<span class="sep"></span>';
  }
  if(t==='pen'||t==='marker'||t==='eraser'){
    const dots=t==='pen'?[4,7,11]:t==='marker'?[8,12,17]:[6,10,16],names=['Tenká','Střední','Silná'];
    h+=dots.map((d,i)=>`<button class="sw sz" data-s="${i}" aria-label="${names[i]}" title="${names[i]}" aria-pressed="${prefs.ts[t].s===i}"><span style="width:${d}px;height:${d}px;${t==='marker'?'border-radius:3px;opacity:.75':''}${t==='eraser'?';background:transparent;border:1.6px solid var(--ink)':''}"></span></button>`).join('');
  }
  o.innerHTML=h;
}
$('#opts').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const t=prefs.tool;
  if(b.dataset.c!=null) prefs.ts[t].c=+b.dataset.c;
  if(b.dataset.s!=null) prefs.ts[t].s=+b.dataset.s;
  savePrefs();renderOpts();
});
document.querySelectorAll('[data-tool]').forEach(b=>{b.innerHTML=svg(b.dataset.tool);b.onclick=()=>setTool(b.dataset.tool);});
$('#undo').innerHTML=svg('undo');$('#redo').innerHTML=svg('redo');
$('#zoomIn').innerHTML=svg('plus',20);$('#zoomOut').innerHTML=svg('minus',20);$('#fit').innerHTML=svg('fit',20);
$('#menuBtn').innerHTML=svg('lock',21);
$('#undo').onclick=undo;$('#redo').onclick=redo;
$('#zoomIn').onclick=()=>{zoomAt(W/2,H/2,cam.z*1.25);saveSoon("cam");};
$('#zoomOut').onclick=()=>{zoomAt(W/2,H/2,cam.z/1.25);saveSoon("cam");};
$('#zoomLabel').onclick=()=>{zoomAt(W/2,H/2,1);saveSoon("cam");};
$('#fit').onclick=fitAll;
$('#addPage').onclick=addPage;
$('#menuBtn').onclick=openMenu;

/* wheel + keyboard for desktop use */
stage.addEventListener('wheel',e=>{
  e.preventDefault();
  if(e.ctrlKey||e.metaKey){const p=local(e);zoomAt(p.x,p.y,cam.z*Math.exp(-e.deltaY*.01));}
  else{cam.x-=e.deltaX;cam.y-=e.deltaY;applyCam();}
  saveSoon("cam");
},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
addEventListener('keydown',e=>{
  const tag=(e.target&&e.target.tagName)||'';
  if(tag==='TEXTAREA'||tag==='INPUT') return;
  if(!libEl.hidden){if(e.key==='Escape'){closePop();closeSheet();}return;}
  if(e.key==='Escape'){closePop();if(!sheet.hidden)closeSheet();else clearSel();return;}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return;}
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.code==='Space'){spaceDown=true;e.preventDefault();return;}
  if((e.key==='Delete'||e.key==='Backspace')&&sel.size){$('#selDelete').click();return;}
  const map={p:'pen',m:'marker',e:'eraser',l:'lasso',t:'text',h:'hand'};
  if(map[e.key.toLowerCase()]&&sheet.hidden) setTool(map[e.key.toLowerCase()]);
});
addEventListener('keyup',e=>{if(e.code==='Space')spaceDown=false;});

let toastT=0;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}

/* ---------- sizing + boot ---------- */
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2.5);
  W=stage.clientWidth;H=stage.clientHeight;rect=stage.getBoundingClientRect();
  for(const c of [paper,cv,live]){c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);}
  if(cam&&doc){requestRender();positionSelbar();}
}
addEventListener('resize',resize);
(async()=>{
  resize();
  setTool(prefs.tool||'pen');updUndo();
  let L=await kvGet('lib');
  if(!L||!Array.isArray(L.docs)){
    L={v:1,folders:[],docs:[]};
    const old=await kvGet('doc'), now=Date.now(), made=[];
    if(old&&Array.isArray(old.pages)){
      const id=uid();L.docs.push({id,name:'Můj první zápisník',folderId:null,created:now,updated:old.savedAt||now,pages:old.pages.length});
      await kvSet('doc:'+id,old);made.push([id,old]);
    }else{
      L.folders.push({id:uid(),name:'Nápady',color:FOLDER_COLORS[0]});
      const id=uid(),sd=seed();L.docs.push({id,name:'Vítej ve WRITE OUT',folderId:null,created:now,updated:now,pages:sd.pages.length});
      await kvSet('doc:'+id,sd);made.push([id,sd]);
    }
    lib=L;
    for(const [id,d] of made){doc={...d,texts:d.texts||[],strokes:d.strokes||[],images:d.images||[]};try{entryById(id).thumb=makeThumb();}catch(e){}}
    doc=null;
    await kvSet('lib',lib);
  }else{lib=L;lib.folders=lib.folders||[];}
  if(prefs.view==='doc'&&prefs.lastDoc&&entryById(prefs.lastDoc)) await openDoc(prefs.lastDoc);
  else showLibrary();
})();
})();
</script>

/* offline: register the service worker that keeps the app on this device */
if('serviceWorker' in navigator && location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{});
}
